<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Personal info</legend>
        <label for="name">First Name</label>
        <input type="text" id="name" name="name" /><br />
        <label for="name">Last Name</label>
        <input type="text" id="name" name="name" /><br />
        <label for="day">Birthday</label>
        <input type="date" id="day" name="day" /><br />
        <label>Gender</label>
        <div class="gender">
          <input type="radio" id="male" name="gender" value="male" />
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="female" />
          <label for="female">Female</label>
        </div>
        <label for="experience">Drive experience</label>
        <select id="experience" name="experience">
          <option value="">---</option>
          <option value="1">1 year</option>
          <option value="2">2 years</option>
          <option value="3">3 years</option>
          <option value="4">4+ years</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>Contacts</legend>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" /><br />
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" /><br />
        <label for="address">Address</label><br />
        <textarea id="address" name="address"></textarea>
      </fieldset>
      <fieldset>
        <legend>Car info</legend>
        <label for="brand">Brand</label>
        <select id="brand" name="brand">
          <option value="">---</option>
          <option value="Ford">Ford</option>
          <option value="Toyota">Toyota</option>
          <option value="BMW">BMW</option></select
        ><br />
        <label for="model">Model</label>
        <select id="model" name="model">
          <option value="">---</option></select
        ><br />
        <label for="used">Used</label>
        <input type="checkbox" id="used" name="used" /><br />
        <label>Color</label>
        <div class="color">
          <input type="radio" id="red" name="color" value="red" />
          <label for="red">Red</label>
          <input type="radio" id="black" name="color" value="black" />
          <label for="black">Black</label>
          <input type="radio" id="blue" name="color" value="blue" />
          <label for="blue">Blue</label>
          <input type="radio" id="white" name="color" value="white" />
          <label for="white">White</label>
          <input type="radio" id="grey" name="color" value="grey" />
          <label for="grey">Grey</label>
        </div>
        <div class="range-container">
          <label for="price">Price</label>
          <input
            type="range"
            name="price"
            id="price"
            min="10"
            max="80"
            step="10"
            list="prices"
          />

          <datalist id="prices">
            <option value="10" label="10"></option>
            <option value="20" label="20"></option>
            <option value="30" label="30"></option>
            <option value="40" label="40"></option>
            <option value="50" label="50"></option>
            <option value="60" label="60"></option>
            <option value="70" label="70"></option>
            <option value="80" label="80"></option>
          </datalist>
        </div>
      </fieldset>
      <div class="buttons">
        <button type="reset">Cancel</button>
        <button type="submit">Ok</button>
      </div>
    </form>
  </body>
</html>
